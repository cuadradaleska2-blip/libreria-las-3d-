Ver inversión y ganancias →</button></div><p class="muted">El margen bruto no descuenta gastos generales e incluye ventas al crédito.</p></section><section class="panel"><h2>Accesos rápidos</h2><div class="quick-grid">${quick.map(([icon,label,target])=>`<button class="quick-tile" onclick="go('${target}')"><span class="emoji">${icon}</span><span>${label}</span></button>`).join('')}</div><p class="muted">Registra tus compras de mercadería en Inversión y ganancias. Los datos de ejemplo solo aparecen cuando registras movimientos.</p></section><section class="panel"><div class="section-title"><h2>Ventas recientes</h2><button class="secondary" onclick="go('caja')">Ver movimientos</button></div>${recent.length?recent.map(s=>`<div class="recent-row"><span class="icon">🛒</span><div class="info"><b>Venta #${s.id}</b><small>${s.clientId?'Crédito · '+esc(c(s.clientId)?.name||'Cliente'):'Contado'} · ${dt(s.date)}</small></div><strong>${money(s.total)}</strong></div>`).join(''):'<p class="muted">Todavía no hay ventas registradas.</p>'}</section>`}
function inversion(){let invested=db.purchases.reduce((a,x)=>a+x.total,0),salesCost=db.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0),0),salesRevenue=db.sales.reduce((a,s)=>a+s.total,0),expenses=db.expenses.reduce((a,x)=>a+(Number(x.amount)||0),0),inventory=db.products.reduce((a,x)=>a+x.stock*x.cost,0);$('view').innerHTML=`<section class="panel"><h2>💵 Inversiones y ganancias</h2><p class="muted">Registra el costo de tus compras de mercadería. Este registro no aumenta existencias automáticamente: actualízalas en Productos para evitar duplicarlas.</p><div class="dash-stats"><div class="dash-stat blue"><div><span>Compras registradas</span><strong>${money(invested)}</strong></div></div><div class="dash-stat yellow"><div><span>Inventario a costo actual</span><strong>${money(inventory)}</strong></div></div><div class="dash-stat green"><div><span>Ganancia bruta en ventas</span><strong>${money(salesRevenue-salesCost)}</strong></div></div><div class="dash-stat pink"><div><span>Ganancia menos gastos</span><strong>${money(salesRevenue-salesCost-expenses)}</strong></div></div></div><p class="muted">Ganancia calculada sobre ventas realizadas, incluso si son al crédito; no equivale al efectivo disponible. Los costos registrados en ventas se conservan al momento de vender.</p><h3>Registrar compra o inversión</h3><div class="grid">${field('invDesc','Descripción (ej. compra de cuadernos)')}${field('invAmount','Total invertido (C$)','number','','min="0.01" step="0.01"')}${field('invDate','Fecha','date',today())}</div><div class="actions"><button onclick="addInvestment()">Guardar inversión</button><button class="secondary" onclick="go('productos')">Actualizar inventario</button></div><h3>Historial de compras</h3><div class="tablewrap"><table><tr><th>Fecha</th><th>Descripción</th><th>Total</th></tr>${db.purchases.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.desc)}</td><td>${money(x.total)}</td></tr>`).join('')||'<tr><td colspan="3">Sin compras registradas</td></tr>'}</table></div></section>`}function addInvestment(){let desc=$('invDesc').value.trim(),total=Number($('invAmount').value),date=$('invDate').value;if(!desc||!Number.isFinite(total)||total<=0||!date)return alert('Completa descripción, fecha y monto válido.');db.purchases.push({id:uid(),date,desc,total});save();inversion();alert('Inversión registrada. Recuerda actualizar las existencias en Productos.')}function productos(){ $('view').innerHTML=`<section class="panel"><h2>Productos e inventario</h2><div class="grid">${field('prName','Nombre del producto')}${field('prCode','Código de barras (opcional)')}${field('prCost','Costo unitario (C$)','number','0','min="0" step="0.01"')}${field('prPrice','Precio de venta (C$)','number','','min="0" step="0.01"')}${field('prStock','Existencia inicial','number','0','min="0" step="1"')}${field('prMin','Alerta cuando queden','number','5','min="0" step="1"')}</div><div class="actions"><button onclick="addProduct()">Guardar producto</button></div><h3>Productos registrados</h3>${field('prSearch','Buscar por nombre o código')}<div id="productList"></div></section>`;$('prSearch').oninput=productList;productList()}function productList(){let q=($('prSearch')?.value||'').toLowerCase();$('productList').innerHTML=`<div class="tablewrap"><table><tr><th>Producto</th><th>Código</th><th>Precio</th><th>Exist.</th><th></th></tr>${db.products.filter(x=>(x.name+' '+x.code).toLowerCase().includes(q)).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td>${money(x.price)}</td><td>${x.stock}${x.stock<=x.min?' ⚠️':''}</td><td><button class="secondary" onclick="editProduct(${x.id})">Editar</button></td></tr>`).join('')}</table></div>`}function addProduct(){let name=$('prName').value.trim(),code=$('prCode').value.trim(),cost=num($('prCost').value),price=num($('prPrice').value),stock=num($('prStock').value),min=num($('prMin').value);if(!name||price<=0||[cost,stock,min].some(x=>x<0)||![stock,min].every(Number.isInteger))return alert('Revisa nombre, precio, costo y cantidades.');if(code&&db.products.some(x=>x.code===code))return alert('Este código ya pertenece a otro producto.');db.products.push({id:uid(),name,code:code||'L3D-'+String(db.next).padStart(6,'0'),cost,price,stock,min});save();productos()}function editProduct(id){let x=p(id);let name=prompt('Nombre',x.name);if(name===null)return;let price=prompt('Precio de venta',x.price);if(price===null)return;let cost=prompt('Costo unitario',x.cost);if(cost===null)return;let stock=prompt('Existencia actual (ajuste manual)',x.stock);if(stock===null)return;let min=prompt('Alerta de existencias',x.min);if(min===null)return;let code=prompt('Código de barras',x.code);if(code===null)return;if(!name.trim()||num(price)<=0||[num(cost),num(stock),num(min)].some(v=>v<0)||![num(stock),num(min)].every(Number.isInteger)||db.products.some(y=>y.id!==id&&y.code===code))return alert('Datos inválidos o código duplicado.');Object.assign(x,{name:name.trim(),price:num(price),cost:num(cost),stock:num(stock),min:num(min),code:code.trim()});save();productos()}
function ventas(){ $('view').innerHTML=`<section class="panel"><h2>Nueva venta</h2><div class="grid"><div><label>Producto</label><select id="saleProduct">${opts(db.products.filter(x=>x.stock>0))}</select></div>${field('saleCode','Buscar por código de barras')}${field('saleQty','Cantidad','number','1','min="1" step="1"')}</div><div class="actions"><button onclick="addCart()">Agregar producto</button><button class="secondary" onclick="lookupCode()">Buscar código</button><button class="secondary" onclick="scanCamera()">📷 Escanear con cámara (experimental)</button></div><div id="scanBox"></div><h3>Carrito</h3><div id="cartBox"></div><div class="grid"><div><label>Forma de venta</label><select id="saleMode" onchange="toggleClient()"><option value="cash">Contado</option><option value="credit">Crédito</option></select></div><div id="clientWrap" class="hidden"><label>Cliente</label><select id="saleClient">${opts(db.clients)}</select></div></div><div class="actions"><button onclick="finishSale()">Confirmar venta</button><button class="secondary" onclick="cart=[];drawCart()">Vaciar carrito</button></div><p class="muted">Una venta a crédito se suma al saldo del cliente; no se cuenta como efectivo cobrado.</p></section>`;drawCart()}function toggleClient(){$('clientWrap').classList.toggle('hidden',$('saleMode').value!=='credit')}function lookupCode(){let x=db.products.find(x=>x.code===$('saleCode').value.trim());if(!x)return alert('No se encontró el código. Registra primero el producto.');$('saleProduct').value=x.id}function addCart(){let x=p($('saleProduct').value),qty=num($('saleQty').value);if(!x||!Number.isInteger(qty)||qty<1)return alert('Selecciona un producto y cantidad válida.');let current=cart.find(i=>i.id===x.id);if((current?.qty||0)+qty>x.stock)return alert('No hay suficientes existencias.');if(current)current.qty+=qty;else cart.push({id:x.id,qty});drawCart()}function drawCart(){let el=$('cartBox');if(!el)return;el.innerHTML=cart.length?`<div class="tablewrap"><table><tr><th>Producto</th><th>Cant.</th><th>Subtotal</th><th></th></tr>${cart.map((i,k)=>`<tr><td>${esc(p(i.id)?.name)}</td><td>${i.qty}</td><td>${money(i.qty*p(i.id).price)}</td><td><button class="secondary" onclick="cart.splice(${k},1);drawCart()">Quitar</button></td></tr>`).join('')}</table></div><p class="total">Total: ${money(cart.reduce((a,i)=>a+i.qty*p(i.id).price,0))}</p>`:'<p class="muted">No hay productos en el carrito.</p>'}function finishSale(){if(!cart.length)return alert('El carrito está vacío.');let credit=$('saleMode').value==='credit',clientId=credit?num($('saleClient').value):null;if(credit&&!c(clientId))return alert('Primero registra o selecciona un cliente.');if(cart.some(i=>!p(i.id)||p(i.id).stock<i.qty))return alert('Revisa las existencias.');let items=cart.map(i=>({id:i.id,name:p(i.id).name,qty:i.qty,price:p(i.id).price,cost:p(i.id).cost})),total=items.reduce((a,i)=>a+i.qty*i.price,0);if(!confirm('¿Confirmar venta por '+money(total)+'?'))return;items.forEach(i=>p(i.id).stock-=i.qty);let s={id:uid(),date:now(),items,total,clientId};db.sales.push(s);save();cart=[];ventas();alert('Venta #'+s.id+' registrada correctamente.');receipt(s)}
function clientes(){ $('view').innerHTML=`<section class="panel"><h2>Clientes y créditos</h2><div class="grid">${field('clName','Nombre del cliente')}${field('clPhone','Teléfono (opcional)','tel')}</div><div class="actions"><button onclick="addClient()">Registrar cliente</button></div><div class="tablewrap"><table><tr><th>Cliente</th><th>Teléfono</th><th>Saldo</th><th></th></tr>${db.clients.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${money(balance(x.id))}</td><td><button class="secondary" onclick="clientDetail(${x.id})">Ver cuenta</button></td></tr>`).join('')}</table></div><div id="clientDetail"></div></section>`}function addClient(){let name=$('clName').value.trim(),phone=$('clPhone').value.trim();if(!name)return alert('Escribe el nombre.');db.clients.push({id:uid(),name,phone});save();clientes()}function clientDetail(id){let x=c(id);if(!x)return;let moves=[...salesFor(id).map(s=>({date:s.date,amount:s.total,type:'Compra #'+s.id,detail:s.items.map(i=>i.qty+' × '+i.name).join(', ')})),...paidFor(id).map(a=>({date:a.date,amount:-a.amount,type:'Abono #'+a.id,detail:a.note||''}))].sort((a,b)=>a.date.localeCompare(b.date));let bal=0;let rows=moves.map(m=>{bal+=m.amount;return `<tr><td>${dt(m.date)}</td><td>${esc(m.type)}<div class="muted">${esc(m.detail)}</div></td><td>${money(m.amount)}</td><td>${money(bal)}</td></tr>`}).join('');$('clientDetail').innerHTML=`<hr><h3>Cuenta de ${esc(x.name)}</h3><p class="total">Saldo: ${money(balance(id))}</p><div class="grid">${field('payAmount','Monto del abono (C$)','number','','min="0.01" step="0.01"')}${field('payNote','Observación (opcional)')}</div><div class="actions"><button onclick="addPayment(${id})">Guardar abono</button><button class="secondary" onclick="printStatement(${id})">Imprimir estado de cuenta</button></div><h3>Historial completo</h3><div class="tablewrap"><table><tr><th>Fecha</th><th>Movimiento</th><th>Importe</th><th>Saldo</th></tr>${rows}</table></div>`}function addPayment(id){let amount=num($('payAmount').value);if(amount<=0||amount>balance(id)+.001)return alert('El abono debe ser mayor que cero y no superar el saldo pendiente.');let a={id:uid(),date:now(),clientId:id,amount,note:$('payNote').value.trim()};db.payments.push(a);save();clientDetail(id);alert('Abono registrado. Nuevo saldo: '+money(balance(id)))}function printStatement(id){let x=c(id),bal=0,moves=[...salesFor(id).map(s=>({date:s.date,desc:'Compra #'+s.id+' — '+s.items.map(i=>i.qty+' × '+i.name).join(', '),amount:s.total})),...paidFor(id).map(a=>({date:a.date,desc:'Abono #'+a.id,amount:-a.amount}))].sort((a,b)=>a.date.localeCompare(b.date));let rows=moves.map(m=>{bal+=m.amount;return `<tr><td>${dt(m.date)}</td><td>${esc(m.desc)}</td><td>${money(m.amount)}</td><td>${money(bal)}</td></tr>`}).join('');printHtml(`<h2>Librería Las 3D</h2><h3>Estado de cuenta: ${esc(x.name)}</h3><table><tr><th>Fecha</th><th>Detalle</th><th>Importe</th><th>Saldo</th></tr>${rows}</table><h3>Saldo pendiente: ${money(balance(id))}</h3>`)}function receipt(s){let html=`<h2>Librería Las 3D</h2><p>Comprobante #${s.id} · ${dt(s.date)}</p><p>${s.clientId?'Cliente: '+esc(c(s.clientId)?.name)+' · Crédito':'Venta de contado'}</p><table>${s.items.map(i=>`<tr><td>${esc(i.name)} × ${i.qty}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table><h3>Total: ${money(s.total)}</h3><p>¡Gracias por su compra!</p>`;if(confirm('¿Deseas imprimir el comprobante?'))printHtml(html)}
function servicios(){$('view').innerHTML=`<section class="panel"><h2>Impresiones y fotocopias</h2><p class="muted">Registra cada servicio como un producto: por ejemplo, “Impresión B/N carta” o “Fotocopia oficio”. Define el precio por página y el costo estimado de papel/tinta. Después, en Ventas, selecciona la cantidad de páginas.</p><div class="actions"><button onclick="go('productos')">Registrar tipo de impresión</button><button onclick="go('ventas')">Cobrar impresión o fotocopia</button></div><p class="notice">En esta primera versión, los servicios se manejan como productos con existencias. Para servicios ilimitados, coloca una existencia amplia y revísala periódicamente. En una actualización separaremos el consumo real de papel y tinta.</p></section>`}
function code128SVG(value){/* Code 128 subset B encoder */const patterns=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];let chars=[104],sum=104;for(let i=0;i<value.length;i++){let v=value.charCodeAt(i)-32;if(v<0||v>94)return null;chars.push(v);sum+=v*(i+1)}chars.push(sum%103,106);let x=10,rects='';for(let v of chars){let pat=patterns[v];for(let j=0;j<pat.length;j++){let w=Number(pat[j])*2;if(j%2===0)rects+=`<rect x="${x}" y="0" width="${w}" height="44" fill="black"/>`;x+=w}}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} 44" preserveAspectRatio="none">${rects}</svg>`}
function etiquetas(){$('view').innerHTML=`<section class="panel"><h2>Etiquetas con códigos de barras</h2><div class="grid"><div><label>Producto</label><select id="tagProduct">${opts(db.products)}</select></div><div><label>Tipo de papel</label><select id="tagPaper"><option value="normal">Hoja carta normal</option><option value="adhesivo">Hoja carta adhesiva</option></select></div>${field('tagQty','Cantidad de etiquetas','number','12','min="1" max="120" step="1"')}</div><div class="actions"><button onclick="previewTags()">Generar etiquetas</button><button class="secondary" onclick="printTags()">Imprimir hoja</button></div><p class="muted">Los códigos internos L3D se generan automáticamente. Etiquetas en Code 128. Para papel adhesivo, utiliza hojas tamaño carta completas y ajusta la impresión a tamaño real.</p><div id="tagPreview"></div></section>`}function previewTags(){let x=p($('tagProduct').value),q=num($('tagQty').value);if(!x||!Number.isInteger(q)||q<1||q>120)return alert('Selecciona un producto y una cantidad entre 1 y 120.');let svg=code128SVG(x.code);if(!svg)return alert('El código contiene caracteres incompatibles con Code 128 B.');lastPrint=`<div class="tagsheet">${Array.from({length:q},()=>`<div class="tag"><strong style="font-size:11px">LIBRERÍA LAS 3D</strong><span class="small">${esc(x.name)}</span>${svg}<span class="small barcode">${esc(x.code)}</span><strong>${money(x.price)}</strong></div>`).join('')}</div>`;$('tagPreview').innerHTML=lastPrint}function printTags(){if(!lastPrint)return alert('Primero genera las etiquetas.');printHtml(lastPrint)}function printHtml(html){$('printArea').innerHTML=html;window.print()}
function caja(){let d=today(),s=db.sales.filter(x=>x.date.slice(0,10)===d),pay=db.payments.filter(x=>x.date.slice(0,10)===d),exp=db.expenses.filter(x=>x.date.slice(0,10)===d),cashSales=s.filter(x=>!x.clientId).reduce((a,x)=>a+x.total,0),collected=pay.reduce((a,x)=>a+x.amount,0),spent=exp.reduce((a,x)=>a+x.amount,0),revenue=s.reduce((a,x)=>a+x.total,0),cost=s.reduce((a,x)=>a+x.items.reduce((z,i)=>z+i.cost*i.qty,0),0);$('view').innerHTML=`<section class="panel"><h2>Caja diaria · ${d}</h2><div class="grid"><div class="stat">Ventas facturadas<strong>${money(revenue)}</strong></div><div class="stat">Cobros de contado<strong>${money(cashSales)}</strong></div><div class="stat">Abonos recibidos<strong>${money(collected)}</strong></div><div class="stat">Gastos registrados<strong>${money(spent)}</strong></div><div class="stat">Flujo neto registrado<strong>${money(cashSales+collected-spent)}</strong></div><div class="stat">Margen bruto estimado de ventas<strong>${money(revenue-cost)}</strong></div></div><p class="muted">El flujo neto no incluye fondo inicial ni retiros. El margen bruto no descuenta gastos generales y puede incluir ventas al crédito. Los abonos no se suman de nuevo a las ventas.</p><h3>Registrar gasto</h3><div class="grid">${field('exName','Concepto')}${field('exAmount','Importe (C$)','number','','min="0.01" step="0.01"')}</div><div class="actions"><button onclick="addExpense()">Guardar gasto</button></div><h3>🔒 Cierre de caja</h3><p class="muted">Guarda una fotografía de los totales del día. El cierre no borra ni modifica las ventas. Registra todos los gastos antes de cerrar.</p><div class="grid">${field('cashOpening','Fondo inicial (C$)','number','0','min="0" step="0.01"')}${field('cashCounted','Efectivo contado (C$)','number','','min="0" step="0.01" placeholder="Opcional"')}</div><div class="actions"><button onclick="closeCash()">🔒 Cerrar caja del día</button></div><h3>Historial de cierres</h3>${cashClosingsHtml()}<h3>Últimas operaciones</h3><div class="tablewrap"><table><tr><th>Fecha</th><th>Movimiento</th><th>Importe</th></tr>${[...s.map(x=>({date:x.date,name:'Venta #'+x.id+(x.clientId?' (crédito)':''),amount:x.total})),...pay.map(x=>({date:x.date,name:'Abono '+esc(c(x.clientId)?.name),amount:x.amount})),...exp.map(x=>({date:x.date,name:'Gasto '+esc(x.name),amount:-x.amount}))].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${dt(x.date)}</td><td>${x.name}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div></section>`}function addExpense(){let name=$('exName').value.trim(),amount=num($('exAmount').value);if(!name||amount<=0)return alert('Completa concepto e importe.');db.expenses.push({id:uid(),date:now(),name,amount});save();caja()}
function cashClosingsHtml(){return db.closings.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Efectivo esperado</th><th>Acción</th></tr>${[...db.closings].sort((a,b)=>b.closedAt.localeCompare(a.closedAt)).map(x=>`<tr><td>${esc(x.day)}<br><small>${dt(x.closedAt)}</small></td><td>${money(x.expected)}</td><td><button class="secondary" onclick="printClosing(${x.id})">🖨️ Imprimir</button></td></tr>`).join('')}</table></div>`:'<p class="muted">Todavía no hay cierres registrados.</p>'}
function closeCash(){let d=today();if(db.closings.some(x=>x.day===d))return alert('Ya existe un cierre de caja para hoy. Puedes imprimirlo desde el historial.');let opening=num($('cashOpening').value),countedRaw=$('cashCounted').value.trim(),counted=countedRaw===''?null:Number(countedRaw);if(opening<0||!Number.isFinite(opening)||counted!==null&&(!Number.isFinite(counted)||counted<0))return alert('Revisa los importes del fondo inicial y efectivo contado.');let sales=db.sales.filter(x=>x.date.slice(0,10)===d),payments=db.payments.filter(x=>x.date.slice(0,10)===d),expenses=db.expenses.filter(x=>x.date.slice(0,10)===d),billed=sales.reduce((a,x)=>a+x.total,0),cash=sales.filter(x=>!x.clientId).reduce((a,x)=>a+x.total,0),paid=payments.reduce((a,x)=>a+x.amount,0),spent=expenses.reduce((a,x)=>a+x.amount,0),expected=opening+cash+paid-spent;let x={id:uid(),day:d,closedAt:now(),billed,cash,paid,spent,opening,expected,counted,difference:counted===null?null:counted-expected,salesCount:sales.length,paymentsCount:payments.length};if(!confirm('¿Guardar el cierre de caja de '+d+'?\nEfectivo esperado: '+money(expected)+'\nEste cierre será una fotografía de los movimientos registrados hasta ahora.'))return;db.closings.push(x);save();caja();alert('Cierre guardado. Descarga ahora un respaldo desde Más → Respaldo.');}
function printClosing(id){let x=db.closings.find(z=>z.id===Number(id));if(!x)return alert('Cierre no encontrado');let html=`<h1>📚 Librería Las 3D</h1><h2>Comprobante de cierre de caja</h2><p><b>Fecha:</b> ${esc(x.day)}<br><b>Registrado:</b> ${dt(x.closedAt)}</p><table><tr><td>Ventas facturadas</td><td>${money(x.billed)}</td></tr><tr><td>Cobros de contado</td><td>${money(x.cash)}</td></tr><tr><td>Abonos recibidos</td><td>${money(x.paid)}</td></tr><tr><td>Gastos</td><td>${money(x.spent)}</td></tr><tr><td>Fondo inicial</td><td>${money(x.opening)}</td></tr><tr><th>Efectivo esperado</th><th>${money(x.expected)}</th></tr>${x.counted===null?'':`<tr><td>Efectivo contado</td><td>${money(x.counted)}</td></tr><tr><td>Diferencia</td><td>${money(x.difference)}</td></tr>`}</table><p>Ventas registradas: ${x.salesCount}. Abonos: ${x.paymentsCount}.</p><p>El cierre es un registro de los movimientos al momento de guardarlo. No incluye retiros no registrados.</p>`;let w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir.');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Cierre de caja</title><style>body{font:15px Arial;padding:22px;max-width:680px;margin:auto;color:#163b5b}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}h1{font-size:23px}</style></head><body>'+html+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function respaldo(){$('view').innerHTML=`<section class="panel"><h2>Respaldo y restauración</h2><p>Exporta una copia de seguridad después de cada jornada y antes de cambiar de dispositivo.</p><div class="actions"><button onclick="exportBackup()">⬇️ Descargar respaldo JSON</button></div><label>Restaurar un respaldo guardado</label><input type="file" id="backupFile" accept=".json,application/json"><div class="actions"><button class="danger" onclick="importBackup()">Restaurar (reemplaza los datos actuales)</button></div><p class="notice">Restaurar reemplaza completamente la información de este dispositivo. Primero descarga un respaldo de los datos actuales. No combines archivos de dos dispositivos: el sistema todavía no fusiona registros.</p><div class="actions"><button class="secondary" onclick="go('inversion')">💵 Inversión y ganancias</button><button class="secondary" onclick="go('servicios')">🖨️ Impresiones</button><button class="secondary" onclick="go('etiquetas')">🏷️ Etiquetas</button><button class="secondary" onclick="go('caja')">💰 Caja</button></div><h3>Información del sistema</h3><p class="muted">${db.products.length} productos · ${db.clients.length} clientes · ${db.sales.length} ventas · ${db.payments.length} abonos · ${db.closings.length} cierres de caja.</p></section>`}function exportBackup(){let blob=new Blob([JSON.stringify({app:'LibreriaLas3D',version:1,exported:now(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Libreria_Las_3D_respaldo_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importBackup(){let f=$('backupFile').files[0];if(!f)return alert('Selecciona un archivo.');try{let b=JSON.parse(await f.text());if(b.app!=='LibreriaLas3D'||b.version!==1||!b.data||!Array.isArray(b.data.products)||!Array.isArray(b.data.clients)||!Array.isArray(b.data.sales)||!Array.isArray(b.data.payments)||!Array.isArray(b.data.expenses)||!Number.isInteger(b.data.next))throw Error('Formato no compatible');if(!confirm('¿Reemplazar TODOS los datos actuales por los del respaldo?'))return;db=b.data;if(!Array.isArray(db.purchases))db.purchases=[];if(!Array.isArray(db.closings))db.closings=[];save();render();alert('Respaldo restaurado.')}catch(e){alert('No se pudo restaurar: '+e.message)}}
async function scanCamera(){let area=$('scanBox');if(!('BarcodeDetector'in window)){area.innerHTML='<p class="notice">Este navegador no ofrece lectura de códigos con cámara. Puedes escribir el código o usar un lector USB que funcione como teclado.</p>';return}if(!navigator.mediaDevices?.getUserMedia){area.innerHTML='<p class="notice">La cámara requiere un contexto seguro (HTTPS o localhost). Puedes usar la búsqueda manual.</p>';return}let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});area.innerHTML='<video id="cam" autoplay playsinline style="width:100%;max-width:340px"></video><div class="actions"><button class="secondary" id="stopCam">Cerrar cámara</button></div>';let video=$('cam');video.srcObject=stream;let active=true;const stop=()=>{active=false;stream.getTracks().forEach(t=>t.stop());area.innerHTML=''};$('stopCam').onclick=stop;let detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e']});async function loop(){if(!active)return;try{let codes=await detector.detect(video);if(codes.length){let code=codes[0].rawValue;stop();$('saleCode').value=code;lookupCode();return}}catch{}if(active)setTimeout(loop,300)}video.onloadedmetadata=loop}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());area.innerHTML='<p class="notice">No se pudo abrir la cámara: '+esc(e.message)+'</p>'}}
render();</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(console.warn)); }</script></body></html>
